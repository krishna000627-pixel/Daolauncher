name: DaoLauncher CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 9.x requires JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Patch KSP version to match Kotlin at build time (safety net)
      - name: Patch KSP version
        run: |
          KOTLIN_VER=$(grep '^kotlin = ' gradle/libs.versions.toml | grep -o '"[^"]*"' | tr -d '"')
          echo "Kotlin version: $KOTLIN_VER"
          sed -i "s/^googleDevtoolsKsp = \".*\"/googleDevtoolsKsp = \"${KOTLIN_VER}-1.0.1\"/" gradle/libs.versions.toml
          echo "KSP patched to: ${KOTLIN_VER}-1.0.1"

      # Stub google-services.json if real one not committed
      - name: Stub google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ Real google-services.json from secret"
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'GSJ'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "daolauncher-stub",
              "storage_bucket": "daolauncher-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.aistudio.daolauncher.cwvrpx" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "stub" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          GSJ
            echo "⚠ Using stub google-services.json (Firebase features won't work)"
          fi

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠ No keystore secret — generating throwaway keystore"
            keytool -genkeypair -alias "upload" -keyalg RSA -keysize 2048 \
              -validity 10000 -keystore my-upload-key.jks \
              -storepass "android" -keypass "android" \
              -dname "CN=DaoLauncher,O=Krishna,C=IN" -noprompt
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload"          >> $GITHUB_ENV
            echo "KEY_PASSWORD=android"      >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH:  my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaoLauncher-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Get Version Info
        if: github.event.inputs.release == 'true'
        id: version
        run: |
          CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]*' | head -1)
          NAME=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"' | head -1)
          echo "code=$CODE"       >> $GITHUB_OUTPUT
          echo "name=$NAME"       >> $GITHUB_OUTPUT
          echo "tag=v$NAME-$CODE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DaoLauncher v${{ steps.version.outputs.name }}
          body: "Build #${{ github.run_number }}"
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
